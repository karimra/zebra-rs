syntax = "proto3";

// Operational state-change stream.
//
// `config.proto` streams changes to the running configuration; this
// streams changes to the daemon's operational state — protocol
// sessions coming up and going down — as typed events, so automation
// (telemetry collectors, a gNMI server, SONiC's STATE_DB writers) can
// react to them without polling `show … json`.
//
// Like zebra.config.v1 and zebra.show.v1 this is a machine-to-machine
// API, versioned independently of the interactive `vty` package and
// served on the same gRPC endpoint.
package zebra.state.v1;

// Event families a subscriber can select. The daemon only builds the
// events of a family while at least one subscriber selects it, so an
// unwatched family costs one atomic load per state change.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  // BGP neighbor FSM transitions.
  BGP_PEER = 1;
  // BFD session state transitions.
  BFD_SESSION = 2;
  // OSPFv2 / OSPFv3 neighbor state transitions.
  OSPF_NEIGHBOR = 3;
  // Interfaces appearing, disappearing, going up or down, and
  // gaining or losing addresses.
  INTERFACE = 4;
  // IS-IS / OSPF shortest-path-first runs whose result was applied.
  SPF_RUN = 5;
  // IS-IS adjacency state transitions.
  ISIS_ADJACENCY = 6;
}

message SubscribeRequest {
  // Families to receive. Empty = every family.
  repeated EventKind kinds = 1;
}

// One state change.
//
// The stream carries changes only: it starts with the first change
// after the subscription is registered, with no snapshot of the
// current state. Read the current state with `show … json` after
// subscribing; a change racing that read is then delivered rather
// than lost.
//
// A subscriber that stops reading long enough to overrun the
// daemon-side buffer is disconnected with RESOURCE_EXHAUSTED; it
// should resubscribe and re-read the current state.
message StateEvent {
  // Daemon-wide sequence number, strictly increasing in delivery
  // order across all families. A gap means events were dropped.
  uint64 seq = 1;
  // Wall-clock time of the change, in nanoseconds since the Unix
  // epoch.
  uint64 timestamp_ns = 2;
  // VRF the change happened in: kernel VRF id (0 = default VRF) and
  // name (empty for the default VRF).
  uint32 vrf_id = 3;
  string vrf = 4;

  oneof event {
    BgpPeerEvent bgp_peer = 10;
    BfdSessionEvent bfd_session = 11;
    OspfNeighborEvent ospf_neighbor = 12;
    InterfaceEvent interface = 13;
    SpfRunEvent spf_run = 14;
    IsisAdjacencyEvent isis_adjacency = 15;
  }
}

// RFC 4271 §8 FSM states.
enum BgpState {
  BGP_STATE_UNSPECIFIED = 0;
  BGP_STATE_IDLE = 1;
  BGP_STATE_CONNECT = 2;
  BGP_STATE_ACTIVE = 3;
  BGP_STATE_OPEN_SENT = 4;
  BGP_STATE_OPEN_CONFIRM = 5;
  BGP_STATE_ESTABLISHED = 6;
}

message BgpPeerEvent {
  // Neighbor transport address.
  string peer_address = 1;
  // Interface of an interface-keyed (unnumbered) neighbor; empty
  // otherwise.
  string interface = 2;
  uint32 local_as = 3;
  uint32 remote_as = 4;
  BgpState old_state = 5;
  BgpState new_state = 6;
  // Why an Established session ended ("Hold timer expired", "BFD
  // down", …). Set only on a transition out of Established.
  string down_reason = 7;
}

// RFC 5880 §4.1 session states.
enum BfdState {
  BFD_STATE_UNSPECIFIED = 0;
  BFD_STATE_ADMIN_DOWN = 1;
  BFD_STATE_DOWN = 2;
  BFD_STATE_INIT = 3;
  BFD_STATE_UP = 4;
}

message BfdSessionEvent {
  string local_address = 1;
  string remote_address = 2;
  // Interface index of a single-hop session; 0 for multihop.
  uint32 ifindex = 3;
  bool multihop = 4;
  BfdState old_state = 5;
  BfdState new_state = 6;
  // Local diagnostic accompanying the change (RFC 5880 §4.1).
  string diagnostic = 7;
}

// RFC 2328 §10.1 neighbor states (OSPFv3 uses the same machine).
enum OspfNeighborState {
  OSPF_NEIGHBOR_STATE_UNSPECIFIED = 0;
  OSPF_NEIGHBOR_STATE_DOWN = 1;
  OSPF_NEIGHBOR_STATE_INIT = 2;
  OSPF_NEIGHBOR_STATE_TWO_WAY = 3;
  OSPF_NEIGHBOR_STATE_EX_START = 4;
  OSPF_NEIGHBOR_STATE_EXCHANGE = 5;
  OSPF_NEIGHBOR_STATE_LOADING = 6;
  OSPF_NEIGHBOR_STATE_FULL = 7;
}

message OspfNeighborEvent {
  // 2 for OSPFv2, 3 for OSPFv3.
  uint32 version = 1;
  string router_id = 2;
  // Neighbor interface address (IPv4 for v2, link-local IPv6 for v3).
  string neighbor_address = 3;
  string interface = 4;
  OspfNeighborState old_state = 5;
  OspfNeighborState new_state = 6;
  // What moved the neighbor backwards: the RFC 2328 §10.2 event
  // ("InactivityTimer", "SeqNumberMismatch", "KillNbr", …),
  // "InterfaceDown", or "RouterIdChange". Empty on forward progress.
  string reason = 7;
}

enum InterfaceChange {
  INTERFACE_CHANGE_UNSPECIFIED = 0;
  // The kernel reported a new interface.
  INTERFACE_CHANGE_ADDED = 1;
  // The interface was deleted.
  INTERFACE_CHANGE_DELETED = 2;
  // Operationally up: administratively up with carrier.
  INTERFACE_CHANGE_UP = 3;
  // Lost administrative state or carrier.
  INTERFACE_CHANGE_DOWN = 4;
  // An address was added to the interface; see `address`.
  INTERFACE_CHANGE_ADDRESS_ADDED = 5;
  // An address was removed from the interface; see `address`.
  INTERFACE_CHANGE_ADDRESS_DELETED = 6;
}

message InterfaceEvent {
  string name = 1;
  uint32 ifindex = 2;
  InterfaceChange change = 3;
  // The address with its prefix length ("10.0.0.1/24"), set on
  // ADDRESS_ADDED / ADDRESS_DELETED only.
  string address = 4;
}

// One SPF computation whose result was installed. Runs superseded
// before they finished (a newer topology arrived) are not reported.
message SpfRunEvent {
  // "isis", "ospf" (v2) or "ospfv3".
  string protocol = 1;
  // IS-IS level (1 or 2); 0 for OSPF.
  uint32 level = 2;
  // OSPF area id; empty for IS-IS.
  string area = 3;
  // Wall time of the computation itself, excluding RIB updates.
  uint64 duration_us = 4;
  // Nodes reached from this router, itself included.
  uint32 nodes_reached = 5;
}

// ISO 10589 §8.4 adjacency states.
enum IsisAdjacencyState {
  ISIS_ADJACENCY_STATE_UNSPECIFIED = 0;
  ISIS_ADJACENCY_STATE_DOWN = 1;
  ISIS_ADJACENCY_STATE_INIT = 2;
  ISIS_ADJACENCY_STATE_UP = 3;
}

message IsisAdjacencyEvent {
  // Neighbor system id ("0000.0000.0001").
  string system_id = 1;
  // Neighbor's dynamic hostname (RFC 5301) when known; else empty.
  string hostname = 2;
  string interface = 3;
  // 1 or 2.
  uint32 level = 4;
  IsisAdjacencyState old_state = 5;
  IsisAdjacencyState new_state = 6;
  // Why the adjacency regressed: "HoldTimerExpired", "BfdDown",
  // "InterfaceDown", or "NeighborLostUs" (the neighbor's hellos no
  // longer list this router). Empty on forward progress.
  string reason = 7;
}

// Operational state-change subscription service.
//
// Subscribe opens a deltas-only stream of the selected families (see
// `StateEvent` for the delivery contract).
service StateService {
  rpc Subscribe(SubscribeRequest) returns (stream StateEvent) {}
}
